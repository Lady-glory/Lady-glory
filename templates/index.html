<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>SILENT :: Guild Glory Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{
  --bg0:#070b14;
  --bg1:#0b1222;
  --bg2:#0f1830;
  --glass:rgba(20,30,55,.55);
  --glass-strong:rgba(24,36,65,.8);
  --stroke:rgba(120,180,255,.12);
  --stroke-hot:rgba(120,200,255,.35);
  --txt:#e6f0ff;
  --txt-dim:rgba(200,220,255,.6);
  --txt-mute:rgba(160,190,230,.35);
  --cyan:#22d3ee;
  --cyan-soft:rgba(34,211,238,.12);
  --emerald:#34d399;
  --emerald-soft:rgba(52,211,153,.12);
  --violet:#a78bfa;
  --amber:#fbbf24;
  --rose:#fb7185;
  --r1:16px; --r2:22px; --r3:28px;
  --nav:68px;
  --shadow:0 8px 40px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:radial-gradient(1200px 800px at 20% 0%,#12224a 0%,#070b14 55%,#04060d 100%);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);position:relative}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:
    linear-gradient(rgba(120,180,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,180,255,.06) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%);
}

/* ========== LOGIN ========== */
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 700px at 50% 20%,#12224a 0%,#070b14 60%,#04060d 100%)}
#gate::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,180,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 70%)}
.gate-card{position:relative;z-index:1;width:100%;max-width:400px;padding:38px 30px;border-radius:var(--r3);background:var(--glass-strong);border:1px solid var(--stroke);backdrop-filter:blur(24px);box-shadow:var(--shadow);text-align:center}
.gate-logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,var(--cyan),var(--emerald));display:flex;align-items:center;justify-content:center;font-size:26px;color:#04121a;margin:0 auto 18px;box-shadow:0 0 40px rgba(34,211,238,.5)}
.gate-title{font-size:24px;font-weight:700;letter-spacing:3px;color:#fff}
.gate-sub{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--txt-mute);margin:6px 0 26px;font-weight:500}
.gate-input{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--stroke);background:rgba(7,11,20,.7);color:#fff;font-family:'Fira Code',monospace;font-size:13px;letter-spacing:2px;outline:none;transition:.2s;text-align:center}
.gate-input:focus{border-color:var(--stroke-hot);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.gate-err{min-height:16px;color:var(--rose);font-size:11px;font-weight:600;margin:6px 0 10px}
.gate-btn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--cyan),var(--emerald));color:#04121a;font-weight:700;font-size:13px;letter-spacing:1.5px;cursor:pointer;transition:.2s;box-shadow:0 6px 24px rgba(34,211,238,.35)}
.gate-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,211,238,.5)}

/* ========== SHELL ========== */
#app{display:none;position:relative;z-index:1}
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px calc(var(--nav) + 32px)}

/* ========== TOP ========== */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:var(--r2);background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px);margin-bottom:14px;box-shadow:var(--shadow)}
.hud-brand{display:flex;align-items:center;gap:12px;min-width:0}
.hud-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--emerald));display:flex;align-items:center;justify-content:center;color:#04121a;font-size:18px;flex-shrink:0;box-shadow:0 0 20px rgba(34,211,238,.4)}
.hud-name{font-size:17px;font-weight:700;letter-spacing:1.5px;color:#fff}
.hud-tagline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--txt-mute);font-weight:500;margin-top:2px}
.hud-live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--emerald);letter-spacing:1px}
.hud-live .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ========== BUTTONS ========== */
.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(20,32,58,.6);color:var(--txt);font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:inherit}
.btn:hover{background:rgba(30,45,80,.9);border-color:var(--stroke-hot);transform:translateY(-1px)}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--emerald));color:#04121a;border:0;font-weight:700;box-shadow:0 4px 18px rgba(34,211,238,.35)}
.btn-cyan:hover{box-shadow:0 8px 26px rgba(34,211,238,.55)}

/* ========== HERO GLORY CARD ========== */
.hero{padding:26px 22px;border-radius:var(--r3);background:linear-gradient(135deg,rgba(34,211,238,.14) 0%,rgba(52,211,153,.08) 50%,rgba(167,139,250,.06) 100%);border:1px solid var(--stroke-hot);backdrop-filter:blur(20px);margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:none;}
.hero.show{display:block;}
.hero::before{content:"";position:absolute;top:-50%;right:-20%;width:70%;height:200%;background:radial-gradient(circle,rgba(34,211,238,.25),transparent 60%);pointer-events:none}
.hero-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--txt-dim);font-weight:600;margin-bottom:8px}
.hero-glory{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1px;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'Fira Code',monospace}
.hero-glory small{font-size:16px;color:var(--txt-dim);-webkit-text-fill-color:var(--txt-dim);margin-left:6px;font-weight:500}
.hero-gained{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border-radius:100px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);font-family:'Fira Code',monospace;font-size:13px;font-weight:700;color:var(--emerald)}
.hero-gained i{font-size:11px}
.hero-meta{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.hero-meta div{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-mute);font-weight:600}
.hero-meta div b{display:block;font-size:13px;color:var(--txt);font-weight:600;font-family:'Fira Code',monospace;letter-spacing:.5px;margin-top:3px;text-transform:none}

/* ========== GUILD GRID ========== */
.guild-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:18px}
.guild-card{padding:20px;border-radius:var(--r2);background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px);cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.guild-card:hover{border-color:var(--stroke-hot);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.guild-card::after{content:"";position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle,rgba(34,211,238,.15),transparent 65%);pointer-events:none}
.gc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.gc-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.25}
.gc-region{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--cyan);background:var(--cyan-soft);border:1px solid rgba(34,211,238,.25);font-family:'Fira Code',monospace}
.gc-level{font-size:9px;font-weight:700;letter-spacing:.8px;padding:4px 8px;border-radius:7px;background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.28);font-family:'Fira Code',monospace;flex-shrink:0}
.gc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc-stat{padding:10px 12px;border-radius:10px;background:rgba(7,11,20,.6);border:1px solid var(--stroke)}
.gc-stat span{display:block;font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-mute);font-weight:700;margin-bottom:4px}
.gc-stat strong{display:block;font-size:14px;color:var(--txt);font-family:'Fira Code',monospace;font-weight:600}
.gc-stat.gain strong{color:var(--emerald)}
.gc-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--stroke);display:flex;justify-content:space-between;font-size:10px;color:var(--txt-mute);letter-spacing:.5px}
.gc-foot b{color:var(--cyan);font-weight:700}

/* ========== EMPTY STATE ========== */
.empty-state{grid-column:1/-1;text-align:center;padding:44px 20px;color:var(--txt-mute);background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r2)}
.empty-state i{font-size:36px;margin-bottom:14px;color:var(--stroke-hot)}
.empty-state p{font-size:13px;margin-bottom:16px;letter-spacing:.5px}

/* ========== DETAIL PANEL ========== */
.detail-panel{display:none;padding:22px;border-radius:var(--r3);background:var(--glass-strong);border:1px solid var(--stroke-hot);backdrop-filter:blur(24px);margin-bottom:18px;animation:drop .35s ease;box-shadow:var(--shadow)}
.detail-panel.show{display:block}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.dp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--stroke);gap:10px;flex-wrap:wrap}
.dp-title{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.dp-title i{color:var(--cyan)}

/* ========== CONSOLE ========== */
.console{border-radius:var(--r2);background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px);overflow:hidden;box-shadow:var(--shadow)}
.console-top{padding:16px 18px;border-bottom:1px solid var(--stroke);display:flex;justify-content:space-between;align-items:center}
.console-top h3{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt);display:flex;align-items:center;gap:9px}
.console-top h3 i{color:var(--cyan)}
.console-body{margin:14px;padding:14px;border-radius:12px;background:rgba(4,6,13,.85);border:1px solid var(--stroke);height:340px;overflow-y:auto;font-family:'Fira Code',monospace;font-size:10.5px;line-height:1.85}
.log{display:flex;gap:10px;margin-bottom:3px;word-break:break-word}
.log-t{color:var(--txt-mute);flex-shrink:0}
.log-m{color:var(--txt-dim)}
.log-m.ok{color:var(--emerald)}
.log-m.warn{color:var(--amber)}
.log-m.err{color:var(--rose)}
.log-m.info{color:var(--cyan)}

/* ========== MODAL ========== */
.modal-back{position:fixed;inset:0;z-index:5000;display:none;align-items:flex-end;justify-content:center;background:rgba(2,4,10,.82);backdrop-filter:blur(14px)}
.modal-back.show{display:flex}
.modal-box{width:100%;max-width:520px;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0));border-radius:26px 26px 0 0;background:var(--glass-strong);border:1px solid var(--stroke-hot);backdrop-filter:blur(28px);animation:slideUp .35s cubic-bezier(.2,.9,.2,1);max-height:92vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h3{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px}
.modal-head h3 i{color:var(--cyan)}
.modal-x{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);background:rgba(20,32,58,.7);color:var(--txt-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-x:hover{color:var(--rose);border-color:rgba(251,113,133,.35)}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:7px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-mute)}
.field select,.field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--stroke);background:rgba(7,11,20,.7);color:#fff;font-family:'Fira Code',monospace;font-size:13px;outline:none;transition:.2s}
.field select:focus,.field input:focus{border-color:var(--stroke-hot);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center;padding:14px}

/* ========== MOBILE NAV ========== */
.mnav{display:none}
@media(max-width:800px){
  .wrap{padding:12px 12px calc(var(--nav) + 20px)}
  .hero-glory{font-size:34px}
  .guild-grid{grid-template-columns:1fr}
  .hud{padding:12px 14px}
  .hud-name{font-size:15px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0));z-index:4000;justify-content:space-around;padding:8px 8px 0;background:rgba(10,16,30,.95);border-top:1px solid var(--stroke);backdrop-filter:blur(24px);align-items:flex-start}
  .mnav-btn{flex:1;border:0;background:none;color:var(--txt-mute);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.5px;padding:8px 4px;border-radius:10px;cursor:pointer;transition:.2s;font-family:inherit}
  .mnav-btn i{font-size:19px}
  .mnav-btn.on{color:var(--cyan)}
  .mnav-btn.on i{filter:drop-shadow(0 0 8px rgba(34,211,238,.6))}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="gate">
  <div class="gate-card">
    <div class="gate-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <div class="gate-title">SILENT</div>
    <div class="gate-sub">Guild Glory Command</div>
    <form onsubmit="doLogin(event)">
      <input id="gate-key" class="gate-input" type="password" placeholder="◆ ACCESS KEY ◆" autocomplete="off">
      <div id="gate-err" class="gate-err"></div>
      <button class="gate-btn" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> ENTER</button>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app">
<div class="wrap">

  <!-- HUD -->
  <header class="hud">
    <div class="hud-brand">
      <div class="hud-mark"><i class="fa-solid fa-shield-halved"></i></div>
      <div>
        <div class="hud-name">SILENT</div>
        <div class="hud-tagline"><span class="hud-live"><span class="dot"></span>LIVE</span> · Guild Glory</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn" onclick="refreshNow()"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button class="btn btn-cyan" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>
      <button class="btn" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </header>

  <!-- HERO -->
  <div class="hero" id="hero">
    <div class="hero-label">◈ TOTAL GLORY</div>
    <div class="hero-glory" id="hero-glory">—<small>pts</small></div>
    <div class="hero-gained" id="hero-gained"><i class="fa-solid fa-arrow-trend-up"></i> +0 gained</div>
    <div class="hero-meta">
      <div>Baseline<b id="hero-base">—</b></div>
      <div>Guild<b id="hero-name">—</b></div>
      <div>Members<b id="hero-members">—</b></div>
      <div>Level<b id="hero-level">—</b></div>
    </div>
  </div>

  <!-- GUILD GRID -->
  <div class="guild-grid" id="guild-grid">
    <div class="empty-state" id="empty-state">
      <i class="fa-solid fa-ghost"></i>
      <p>No active team yet.</p>
      <button class="btn btn-cyan" onclick="openModal()" style="margin:0 auto;"><i class="fa-solid fa-plus"></i> Create Team</button>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detail-panel">
    <div class="dp-head">
      <div class="dp-title"><i class="fa-solid fa-users"></i><span id="dp-title-txt">Guild Details</span></div>
      <button class="btn" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="dp-body"></div>
  </div>

  <!-- CONSOLE -->
  <div class="console">
    <div class="console-top">
      <h3><i class="fa-solid fa-terminal"></i> Live Console</h3>
      <button class="btn" onclick="clearLogs()"><i class="fa-solid fa-trash"></i></button>
    </div>
    <div class="console-body" id="console-body"></div>
  </div>

</div>

<!-- NAV -->
<nav class="mnav">
  <button class="mnav-btn on" onclick="tabHome(this)"><i class="fa-solid fa-house"></i>Home</button>
  <button class="mnav-btn" onclick="openModal()"><i class="fa-solid fa-circle-plus"></i>New Team</button>
  <button class="mnav-btn" onclick="tabConsole(this)"><i class="fa-solid fa-terminal"></i>Console</button>
</nav>

</div>

<!-- MODAL -->
<div class="modal-back" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fa-solid fa-users-gear"></i> Create New Team</h3>
      <button class="modal-x" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form onsubmit="submitTeam(event)">
      <div class="field">
        <label>Region</label>
        <select id="m-region">
          <option value="BD">BD — Bangladesh</option>
          <option value="BR" selected>BR — brazil</option>
          <option value="ID">ID — Indonesia</option>
          <option value="PK">PK — Pakistan</option>
        </select>
      </div>
      <div class="field">
        <label>Guild / Clan ID</label>
        <input id="m-clan" type="text" placeholder="e.g. 2055589692" value="">
      </div>
      <div class="field">
        <label>Squad Size</label>
        <select id="m-count">
          <option value="4" selected>4 Bots (Full)</option>
          <option value="3">3 Bots</option>
          <option value="2">2 Bots</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-cyan" id="m-submit"><i class="fa-solid fa-bolt"></i> Create & Start</button>
      </div>
    </form>
  </div>
</div>

<script>
const ACCESS_KEY = "Lady";
const SESSION_KEY = "Lady";
const API_BASE = "https://star-guild-info.lovable.app/api/public/info";

let activeGuilds = []; // Only shows currently active created team
let pollTimer = null;

/* -------- AUTH -------- */
function boot(){
  const saved = localStorage.getItem(SESSION_KEY);
  if(saved === ACCESS_KEY) showApp(true);
}
function doLogin(e){
  e.preventDefault();
  const v = document.getElementById("gate-key").value.trim();
  const err = document.getElementById("gate-err");
  if(v === ACCESS_KEY){
    localStorage.setItem(SESSION_KEY, v);
    err.textContent = ""; showApp(false);
  } else { err.textContent = "✕ Invalid key"; document.getElementById("gate-key").value = ""; }
}
function doLogout(){
  if(!confirm("Logout?")) return;
  localStorage.removeItem(SESSION_KEY); location.reload();
}
function showApp(restore){
  const gate = document.getElementById("gate"), app = document.getElementById("app");
  if(restore){ gate.style.display="none"; app.style.display="block"; startEngine(); return; }
  gate.style.transition="opacity .35s"; gate.style.opacity="0";
  setTimeout(()=>{ gate.style.display="none"; app.style.display="block"; startEngine(); }, 350);
}

/* -------- ENGINE -------- */
function startEngine(){
  // Clear any old tracked data from localStorage
  localStorage.removeItem("tracked_guilds");
  
  refreshNow();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>{ pollGuilds(); }, 10000); // 10 SECONDS
}

async function fetchGuild(region, clan_id){
  try {
    const url = `${API_BASE}?clan_id=${encodeURIComponent(clan_id)}&region=${encodeURIComponent(region.toLowerCase())}`;
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } catch(e) { console.error("Guild fetch failed:", e); return null; }
}

async function refreshNow(){
  if(activeGuilds.length === 0) {
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("hero").classList.remove("show");
  }
  await pollGuilds();
  await fetchStats();
}

async function pollGuilds(){
  if(activeGuilds.length === 0) return;
  const results = [];
  for(const g of activeGuilds){
    const data = await fetchGuild(g.region, g.clan_id);
    if(data && data.status === "success"){
      const enriched = await attachBaseline(g.region, g.clan_id, data);
      results.push(enriched);
    }
  }
  if(results.length > 0){
    renderHero(results[0]);
    renderGuildGrid(results);
    if(document.getElementById("detail-panel").classList.contains("show")){
      renderDetail(results[0]);
    }
  }
}

async function attachBaseline(region, clan_id, apiData){
  const currentGlory = Number(apiData.glory_points || apiData.score || 0);
  let baseline = null;
  try {
    const r = await fetch(`/api/guild/info?region=${encodeURIComponent(region)}&clan_id=${encodeURIComponent(clan_id)}`, {cache:"no-store"});
    if(r.ok) { const d = await r.json(); baseline = Number(d.baseline_glory ?? currentGlory); }
  } catch(e) {}
  
  if(baseline === null) baseline = Number(localStorage.getItem(`base_${region}_${clan_id}`) || currentGlory);
  localStorage.setItem(`base_${region}_${clan_id}`, baseline);

  return {
    region: region.toUpperCase(),
    clan_id: String(clan_id),
    guild_name: apiData.clan_name || apiData.guild_name || "Unknown Guild",
    guild_level: Number(apiData.guild_level || apiData.level || 0),
    current_members: Number(apiData.current_members || 0),
    total_members: Number(apiData.total_members || 0),
    members_online: Number(apiData.members_online || 0),
    guild_bio: apiData.guild_bio || "",
    guild_rank: Number(apiData.rank || apiData.guild_position || 0),
    current_glory: currentGlory,
    baseline_glory: baseline,
    gained_glory: currentGlory - baseline,
  };
}

/* -------- RENDER -------- */
function renderHero(g){
  document.getElementById("hero").classList.add("show");
  document.getElementById("hero-glory").innerHTML = fmt(g.current_glory) + '<small>pts</small>';
  document.getElementById("hero-gained").innerHTML = `<i class="fa-solid fa-arrow-trend-up"></i> +${fmt(g.gained_glory)} gained`;
  document.getElementById("hero-base").textContent = fmt(g.baseline_glory);
  document.getElementById("hero-name").textContent = g.guild_name.length > 22 ? g.guild_name.slice(0,20)+"…" : g.guild_name;
  document.getElementById("hero-members").textContent = `${g.current_members}/${g.total_members}`;
  document.getElementById("hero-level").textContent = `Lv ${g.guild_level}`;
}

function renderGuildGrid(list){
  const grid = document.getElementById("guild-grid");
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-state" id="empty-state">
      <i class="fa-solid fa-ghost"></i>
      <p>No active team yet.</p>
      <button class="btn btn-cyan" onclick="openModal()" style="margin:0 auto;"><i class="fa-solid fa-plus"></i> Create Team</button>
    </div>`;
    return;
  }
  grid.innerHTML = list.map((g,i)=>`
    <div class="guild-card" onclick='openDetail(${i})'>
      <div class="gc-head">
        <div>
          <div class="gc-name">${esc(g.guild_name)}</div>
          <span class="gc-region">${esc(g.region)}</span>
        </div>
        <span class="gc-level">LV ${g.guild_level}</span>
      </div>
      <div class="gc-stats">
        <div class="gc-stat"><span>Glory</span><strong>${fmt(g.current_glory)}</strong></div>
        <div class="gc-stat gain"><span>Gained</span><strong>+${fmt(g.gained_glory)}</strong></div>
        <div class="gc-stat"><span>Members</span><strong>${g.current_members}/${g.total_members}</strong></div>
        <div class="gc-stat"><span>Online</span><strong>${g.members_online}</strong></div>
      </div>
      <div class="gc-foot">
        <span>ID: <b>${esc(g.clan_id)}</b></span>
        <span>Rank #${fmt(g.guild_rank)}</span>
      </div>
    </div>
  `).join("");
}

function openDetail(i){
  const g = activeGuilds[i];
  if(!g) return;
  fetchGuild(g.region, g.clan_id).then(async d=>{
    if(!d) return;
    const enriched = await attachBaseline(g.region, g.clan_id, d);
    renderDetail(enriched);
  });
}

function renderDetail(g){
  const panel = document.getElementById("detail-panel");
  const title = document.getElementById("dp-title-txt");
  const body = document.getElementById("dp-body");
  title.textContent = `${g.guild_name} — ${g.region} · ${g.clan_id}`;
  body.innerHTML = `
    <div class="gc-stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px">
      <div class="gc-stat"><span>Current Glory</span><strong>${fmt(g.current_glory)}</strong></div>
      <div class="gc-stat gain"><span>Gained</span><strong>+${fmt(g.gained_glory)}</strong></div>
      <div class="gc-stat"><span>Baseline</span><strong>${fmt(g.baseline_glory)}</strong></div>
      <div class="gc-stat"><span>Rank</span><strong>#${fmt(g.guild_rank)}</strong></div>
      <div class="gc-stat"><span>Level</span><strong>Lv ${g.guild_level}</strong></div>
      <div class="gc-stat"><span>Members</span><strong>${g.current_members}/${g.total_members}</strong></div>
    </div>
    <div style="padding:12px;border-radius:12px;background:rgba(7,11,20,.55);border:1px solid var(--stroke);font-size:11px;color:var(--txt-dim);line-height:1.6">
      <b style="color:var(--cyan)">Bio:</b> ${esc(g.guild_bio || "—")}
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="resetBaseline('${g.region}','${g.clan_id}')"><i class="fa-solid fa-rotate-left"></i> Reset Baseline</button>
      <button class="btn" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i> Close</button>
    </div>
  `;
  panel.classList.add("show");
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeDetail(){ document.getElementById("detail-panel").classList.remove("show"); }

async function resetBaseline(region, clan_id){
  if(!confirm("Reset baseline to current glory?")) return;
  try {
    await fetch("/api/guild/reset", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({region, clan_id})});
    await pollGuilds();
  } catch(e){ alert("Failed to reset baseline"); }
}

/* -------- STATS + LOGS -------- */
async function fetchStats(){
  try {
    const r = await fetch("/api/stats", {cache:"no-store"});
    const d = await r.json();
    const logs = Array.isArray(d.logs) ? d.logs : [];
    const stream = document.getElementById("console-body");
    stream.innerHTML = logs.map(l=>`
      <div class="log"><span class="log-t">[${esc(l.time||"")}]</span><span class="log-m ${l.level||"info"}">${esc(l.message||"")}</span></div>
    `).join("");
    stream.scrollTop = stream.scrollHeight;
  } catch(e){}
}
async function clearLogs(){
  try { await fetch("/api/logs/clear", {method:"POST"}); } catch(e){}
  document.getElementById("console-body").innerHTML = "";
}

/* -------- CREATE TEAM -------- */
function openModal(){ document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }

async function submitTeam(e){
  e.preventDefault();
  const region = document.getElementById("m-region").value;
  const clan = document.getElementById("m-clan").value.trim();
  const count = parseInt(document.getElementById("m-count").value, 10);
  if(!clan){ alert("Guild ID is required"); return; }
  
  const btn = document.getElementById("m-submit");
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';

  // 1. Clear old guilds, set ONLY this new one
  activeGuilds = [{ region, clan_id: String(clan) }];
  
  // 2. Clear the old baseline from local storage for this specific guild
  localStorage.removeItem(`base_${region.toUpperCase()}_${clan}`);

  // 3. Call create_team API (if you have it on backend)
  try {
    await fetch("/api/create_team", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({region, clan_id: clan, count, password: "LADY"})
    });
  } catch(e) { /* Fine if endpoint is missing */ }

  // 4. Force fetch to generate new baseline & show only this guild
  await pollGuilds();
  await fetchStats();

  btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Create & Start';
  closeModal();
}

/* -------- TABS -------- */
function tabHome(btn){ setActive(btn); window.scrollTo({top:0,behavior:"smooth"}); }
function tabConsole(btn){ setActive(btn); document.querySelector(".console").scrollIntoView({behavior:"smooth",block:"start"}); }
function setActive(btn){
  document.querySelectorAll(".mnav-btn").forEach(b=>b.classList.remove("on"));
  if(btn) btn.classList.add("on");
}

/* -------- UTILS -------- */
function fmt(n){ return Number(n||0).toLocaleString("en-IN"); }
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

/* -------- BOOT -------- */
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
